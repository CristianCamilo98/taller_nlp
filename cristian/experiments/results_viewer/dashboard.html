<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Comparador de resultados · experimentos</title>
<style>
  :root {
    --bg: #f7f6f3;
    --panel: #ffffff;
    --ink: #1c1b19;
    --muted: #6b6560;
    --stroke: #e4e0d8;
    --accent: #1f4b6e;
    --ok: #1f6b45;
    --ok-bg: #e6f3eb;
    --fail: #9b2c2c;
    --fail-bg: #f8e8e8;
    --na: #8a847c;
    --na-bg: #efeee9;
    --warn: #8a5a00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.45;
  }
  header {
    padding: 1.25rem 1.5rem 1rem;
    border-bottom: 1px solid var(--stroke);
    background: var(--panel);
  }
  header h1 {
    margin: 0 0 0.25rem;
    font-size: 1.35rem;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }
  main {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    min-height: calc(100vh - 88px);
  }
  aside {
    padding: 1rem 1rem 2rem;
    border-right: 1px solid var(--stroke);
    background: var(--panel);
  }
  aside h2 {
    margin: 0 0 0.6rem;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .run-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    max-height: 55vh;
    overflow: auto;
  }
  .run-item {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.5rem;
    align-items: start;
    padding: 0.55rem 0.6rem;
    border: 1px solid var(--stroke);
    border-radius: 6px;
    cursor: pointer;
    background: var(--bg);
  }
  .run-item:hover { border-color: #cfc8bc; }
  .run-item.selected {
    border-color: var(--accent);
    background: #eef4f8;
  }
  .run-item strong {
    display: block;
    font-size: 0.86rem;
  }
  .run-item span {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .aside-actions {
    display: flex;
    gap: 0.4rem;
    margin: 0.75rem 0 1rem;
  }
  button, select {
    font: inherit;
    border-radius: 6px;
    border: 1px solid var(--stroke);
    background: var(--panel);
    color: var(--ink);
    padding: 0.35rem 0.65rem;
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button:hover { filter: brightness(0.97); }
  .content {
    padding: 1rem 1.25rem 2.5rem;
    overflow: auto;
  }
  section {
    margin-bottom: 1.5rem;
  }
  section h2 {
    margin: 0 0 0.65rem;
    font-size: 1.05rem;
  }
  .caption {
    margin: -0.35rem 0 0.75rem;
    color: var(--muted);
    font-size: 0.82rem;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    font-size: 0.86rem;
  }
  th, td {
    border: 1px solid var(--stroke);
    padding: 0.45rem 0.55rem;
    text-align: left;
    vertical-align: top;
  }
  th {
    background: #f0eee8;
    font-weight: 600;
    white-space: nowrap;
  }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill {
    display: inline-block;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.fail { background: var(--fail-bg); color: var(--fail); }
  .pill.na { background: var(--na-bg); color: var(--na); }
  .heatmap-wrap { overflow: auto; }
  .heatmap td.cell {
    text-align: center;
    font-weight: 700;
    width: 3.2rem;
    cursor: pointer;
  }
  .heatmap td.cell.ok { background: var(--ok-bg); color: var(--ok); }
  .heatmap td.cell.fail { background: var(--fail-bg); color: var(--fail); }
  .heatmap td.cell.na { background: var(--na-bg); color: var(--na); }
  .heatmap td.qid {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78rem;
    white-space: nowrap;
    cursor: pointer;
  }
  .heatmap tr.active td { outline: 2px solid var(--accent); outline-offset: -2px; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
    margin-bottom: 0.75rem;
  }
  .toolbar label {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .drill {
    display: none;
    border: 1px solid var(--stroke);
    background: var(--panel);
    border-radius: 8px;
    padding: 1rem;
  }
  .drill.visible { display: block; }
  .drill h3 {
    margin: 0 0 0.35rem;
    font-size: 1rem;
  }
  .drill .meta {
    color: var(--muted);
    font-size: 0.82rem;
    margin-bottom: 0.85rem;
  }
  .compare-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 0.75rem;
  }
  .card {
    border: 1px solid var(--stroke);
    border-radius: 8px;
    padding: 0.75rem;
    background: var(--bg);
  }
  .card h4 {
    margin: 0 0 0.5rem;
    font-size: 0.88rem;
  }
  .card pre {
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0.25rem 0 0.7rem;
    font-size: 0.8rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 6px;
    padding: 0.55rem;
    max-height: 220px;
    overflow: auto;
  }
  .kv {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 0.2rem 0.5rem;
    font-size: 0.8rem;
    margin-bottom: 0.55rem;
  }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .empty {
    padding: 1.5rem;
    color: var(--muted);
    background: var(--panel);
    border: 1px dashed var(--stroke);
    border-radius: 8px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--stroke); }
  }
</style>
</head>

encia que obliguen a NVIDIA a realizar provisiones por inventario y cargos por exceso de compras.\n\n5. **Riesgo de nuevas restricciones unilaterales o multilaterales**: Existe la posibilidad de que se impongan controles adicionales sobre GPUs para IA, productos de redes (interconexiones de alta velocidad) y gaming, lo que podría tener un impacto desproporcionado en NVIDIA frente a sus competidores.\n\n6. **Respuestas de gobiernos extranjeros**: Reguladores en China están investigando si el cumplimiento de los controles de exportación de EE.UU. discrimina injustamente a clientes chinos, lo que podría resultar en sanciones financieras o restricciones operativas.", "respuesta_estructurada": {"respuesta": "NVIDIA identifica en sus factores de riesgo (Item 1A) del FY2025 múltiples riesgos relacionados con los controles a la exportación. Los principales son:\n\n1. **Pérdida de mercado en China y otros países**: Los controles de exportación de EE.UU. han restringido la venta de productos como los chips A100 y H100, y cualquier circuito integrado que supere ciertos umbrales de rendimiento, afectando la capacidad de NVIDIA para servir al mercado chino y a más de 150 países designados como \"Tier 2\".\n\n2. **Fomento de la \"deslocalización\" del diseño**: Los controles excesivos o cambiantes incentivan a clientes fuera de China a \"diseñar fuera\" los semiconductores estadounidenses para reducir su carga de cumplimiento normativo, lo que perjudica la posición de mercado de NVIDIA.\n\n3. **Ventaja competitiva para rivales extranjeros**: Los controles pueden llevar a gobiernos extranjeros a pedir a sus clientes que compren a competidores no estadounidenses, y también aumentan la inversión en competidores extranjeros que no están sujetos a las mismas restricciones.\n\n4. **Interrupciones en la cadena de suministro y distribución**: Los controles afectan el almacenamiento y distribución desde Hong Kong, y podrían imponer requisitos de licencia que obliguen a NVIDIA a realizar provisiones por inventario y cargos por exceso de compras.\n\n5. **Riesgo de nuevas restricciones unilaterales o multilaterales**: Existe la posibilidad de que se impongan controles adicionales sobre GPUs para IA, productos de redes (interconexiones de alta velocidad) y gaming, lo que podría tener un impacto desproporcionado en NVIDIA frente a sus competidores.\n\n6. **Respuestas de gobiernos extranjeros**: Reguladores en China están investigando si el cumplimiento de los controles de exportación de EE.UU. discrimina injustamente a clientes chinos, lo que podría resultar en sanciones financieras o restricciones operativas.", "cifra": null, "unidad": "N/A", "ticker": "NVDA", "ejercicio": null, "fuente": "texto", "cita": "Excessive or shifting export controls have already and may in the future encourage customers outside China and other impacted regions to \"design-out\" certain U.S. semiconductors from their products to reduce the compliance burden and risk, and to ensure that they are able to serve markets worldwide. Excessive or shifting export controls have already encouraged and may in the future encourage overseas governments to request that our customers purchase from our competitors rather than NVIDIA or other U.S. firms, harming our business, market position, and financial results.", "chunk_id": null, "concepto_xbrl": null, "ejercicio_inicial": null, "ejercicio_final": null, "valor_inicial": null, "valor_final": null, "delta": null, "porcentaje": null, "tool_calls_agente": ["search_filings"], "tool_calls_detallado": [{"name": "search_filings", "args": {"fiscal_year": 2025, "item": "1A", "query": "export controls risk", "ticker": "NVDA"}}], "thread_id": "q-8a46d2826049430c9efb31583ab1dacc", "guardrail_retry_count": 0, "guardrail_ok": true, "guardrail_mensaje": "sin cifra que verificar"}, "respuesta_esperada": "Que los controles a la exportación pueden impactar negativamente la demanda en China y otros mercados.", "cifra_agente": null, "cifra_esperada": null, "t jsonl::run-3cea1a52dcba458da8d0f0d262edb321", "source_file": "gemini-3.8-flashv4_k2.jsonl", "run_id": "run-3cea1a52dcba458da8d0f0d262edb321", "question_id": "g3-008", "familia": "extractiva", "pregunta": "¿Qué riesgo relacionado con los controles a la exportación menciona NVIDIA en sus factores de riesgo de FY2025?", "acierto_cifra": null, "acierto_cita": false, "acierto_trayectoria": true, "respuesta_agente": "En el Item 1A de su informe 10-K para el ejercicio fiscal 2025, NVIDIA detalla varios riesgos clave derivados de los controles a la exportación impuestos por el gobierno de EE. UU. (USG):\n\n1. **Restricciones de licencias y exclusión de mercados**: Las normas de control exigen licencias para exportar circuitos integrados y sistemas avanzados de computación (incluyendo familias A100, H100, A800, H800, L40S, RTX 4090 y sistemas Blackwell como B200 y GB200) a China y otros países (grupos D1, D4, D5, Oriente Medio y las nuevas normas 'AI Diffusion' de enero de 2025). NVIDIA señala que no ha recibido licencias para enviar estos productos restringidos a China, lo que amenaza con excluirla parcial o totalmente de dicho mercado.\n2. **Pérdida de competitividad**: Estas restricciones benefician a competidores que ofrecen alternativas no sujetas a los controles (proveedores en China, Europa o Israel), incentivando a los clientes a sustituir los productos de NVIDIA ('design-out') o desarrollar soluciones internas.\n3. **Impacto operativo y financiero**: Conlleva riesgos de provisiones por inventario no vendido, cargos por obligaciones de compra en exceso, retrasos o denegaciones de licencias, y posibles disrupciones en su cadena de suministro y distribución (por ejemplo, operaciones radicadas en Hong Kong).\n4. **Respuestas regulatorias de gobiernos extranjeros**: Existe el riesgo de represalias o investigaciones por parte de autoridades en China (por ejemplo, investigando si el cumplimiento de las restricciones de EE. UU. incurre en trato discriminatorio).", "respuest ignificativas de inventario y cargos por obligaciones de compra en exceso. Además, los controles pueden restringir la capacidad de NVIDIA para vender productos en ciertos mercados y afectar su cadena de suministro y distribución.", "cifra": null, "unidad": null, "ticker": "NVDA", "ejercicio": 2025, "fuente": "texto", "cita": "Excessive or shifting export controls have already and may in the future encourage customers outside China and other impacted regions to “design-out” certain U.S. semiconductors from their products to reduce the compliance burden and risk, and to ensure that they are able to serve markets worldwide. Excessive or shifting export controls have already encouraged and may in the future encourage overseas governments to request that our customers purchase from our competitors rather than NVIDIA or other U.S. firms, harming our business, market position, and financial results. As a result, excessive or shifting export controls may negatively impact demand for our products and services not only in China, but also in other markets, such as Europe, Latin America, and Southeast Asia. Excessive or shifting export controls increase the risk of investing in U.S. advanced semiconductor products, because by the time a new product is ready for market, it may be subject to new unilateral export controls restricting its sale. At the same time, such controls may increase investment in foreign competitors, which would be less likely to be restricted by U.S. controls. If additional products are subject to worldwide licensing requirements, we may incur significant inventory provisions and excess purchase obligation charges.", "chunk_id": "NVDA-2025-1A-0038", "concepto_xbrl": null, "ejercicio_inicial": null, "ejercicio_final": null, "valor_inicial": null, "valor_final": null, "delta": null, "porcentaje": null, "tool_calls_agente": ["search_filings"], "tool_calls_detallado": [{"name": "search_filings", "args": {"query": "export control risk", "ticker": "NVDA", "fiscal l TJUE y revisiones entre reguladores europeos, lo que genera incertidumbre sobre sanciones y cumplimiento. Menciona una multa de la IDPC (Comisión Irlandesa de Protección de Datos) de 1.200 millones de euros por transferencias de datos del EEE.\n\n2. **CCPA y leyes estatales de EE.UU.**: La California Consumer Privacy Act (enmendada por la California Privacy Rights Act) impone reglas de transparencia y limita el uso de información personal sensible. Otros estados han propuesto leyes similares que afectan al negocio publicitario.\n\n3. **ePrivacy Directive**: La evolución de su interpretación en Europa sobre cookies y tecnologías similares puede impactar directamente el uso de estas tecnologías, con limitaciones adicionales en productos de mensajería.\n\n4. **Leyes de privacidad juvenil**: Varios estados han propuesto leyes enfocadas en derechos de privacidad para menores de 18 años.\n\n5. **Leyes en otras jurisdicciones**: Brasil, Reino Unido y otros países han adoptado regulaciones similares de protección de datos.\n\n6. **Orden de consentimiento con la FTC**: Meta está sujeta a un consent order con la Comisión Federal de Comercio de EE.UU. que impone requisitos operativos estrictos, supervisión de la dirección y el consejo, y evaluaciones periódicas por terceros.\n\n7. **Litigios e investigaciones**: Menciona investigaciones en India sobre las actualizaciones de WhatsApp, demandas colectivas por el uso de Meta Pixel, y procedimientos formales de la Comisión Europea sobre el modelo de \"suscripción sin anuncios\".\n\nMeta advierte que estos marcos regulatorios son complejos, están en evolución, y su incumplimiento o las limitaciones resultantes podrían afectar materialmente su negocio, especialmente su negocio publicitario.", "respuesta_estructurada": {"respuesta": "En sus factores de riesgo del FY2024 (Item 1A), Meta identifica múltiples riesgos regulatorios relacionados con privacidad de datos. Los principales son:\n\n1. **GDPR (Reglamento General de Protección  y otras leyes que limitan el uso de datos y tecnologías como cookies, con posibles penalizaciones por incumplimiento.", "cifra": null, "unidad": null, "ticker": "META", "ejercicio": 2024, "fuente": "texto", "cita": "The interpretation of the GDPR is still evolving, including through decisions of the CJEU, and draft decisions in investigations by the IDPC are subject to review by other European privacy regulators as part of the GDPR's consistency mechanism, which may lead to significant changes in the final outcome of such investigations. We also face potential enforcement from European privacy regulators other than the IDPC... The California Consumer Privacy Act, as amended by the California Privacy Rights Act (CCPA), also establishes certain transparency rules and creates certain data privacy rights for users... In Europe, evolving interpretation of the ePrivacy Directive's requirements regarding the use of cookies and similar technologies may lead to regulators imposing specific measures in the future which could directly impact our use of such technologies.", "chunk_id": "META-2024-1A-0057", "concepto_xbrl": null, "ejercicio_inicial": null, "ejercicio_final": null, "valor_inicial": null, "valor_final": null, "delta": null, "porcentaje": null, "tool_calls_agente": ["search_filings"], "tool_calls_detallado": [{"name": "search_filings", "args": {"query": "data privacy regulatory risk", "ticker": "META", "fiscal_year": 2024, "item": "1A", "k": 3}}], "thread_id": "q-9231fd8619d44a32972cebd19f3b8613", "guardrail_retry_count": 0, "guardrail_ok": true, "guardrail_mensaje": "sin cifra que verificar"}, "respuesta_esperada": "Que la interpretación y aplicación del GDPR, así como las penalizaciones, están sujetas a incertidumbre significativa.", "cifra_agente": null, "cifra_esperada": null, "tool_calls_agente": ["search_filings"], "tool_calls_detallado": [{"name": "search_filings", "args": {"query": "data privacy regulatory risk", "ticker": "META", "fiscal_year": 2024, "ite ión mediante coberturas, las fluctuaciones significativas en los tipos de cambio pueden afectar negativamente sus ingresos y ganancias. Además, los programas de cobertura conllevan riesgos inherentes que podrían perjudicar su condición financiera y resultados operativos.", "cifra": null, "unidad": null, "ticker": "GOOGL", "ejercicio": 2025, "fuente": "texto", "cita": "Because we conduct business in currencies other than US dollars but report our financial results in US dollars, we have faced, and will continue to face, exposure to fluctuations in foreign currency exchange rates. Although we hedge a portion of our international currency exposure, significant fluctuations in exchange rates between the US dollar and foreign currencies have and may in the future adversely affect our revenues and earnings. Hedging programs are also inherently risky and could expose us to additional risks that could harm our financial condition and operating results.", "chunk_id": "GOOGL-2025-1A-0012", "concepto_xbrl": null, "ejercicio_inicial": null, "ejercicio_final": null, "valor_inicial": null, "valor_final": null, "delta": null, "porcentaje": null, "tool_calls_agente": ["search_filings"], "tool_calls_detallado": [{"name": "search_filings", "args": {"query": "foreign currency exchange risk market risk", "ticker": "GOOGL", "fiscal_year": 2025, "item": "1A", "k": 5}}], "thread_id": "q-a42ec2deaf57477e95459ecc4f86f0f2", "guardrail_retry_count": 0, "guardrail_ok": true, "guardrail_mensaje": "sin cifra que verificar"}, "respuesta_esperada": "Que sus ingresos internacionales, activos y pasivos monetarios en divisas e inversiones en subsidiarias extranjeras la exponen al riesgo de fluctuaciones del tipo de cambio.", "cifra_agente": null, "cifra_esperada": null, "tool_calls_agente": ["search_filings"], "tool_calls_detallado": [{"name": "search_filings", "args": {"query": "foreign currency exchange risk market risk", "ticker": "GOOGL", "fiscal_year": 2025, "item": "1A", "k": 5}}], "tool_call_c \n\n2. **Medición**: Una vez superado el umbral de reconocimiento, se mide el beneficio fiscal como el mayor monto que tiene más del 50% de probabilidad de realizarse al finalizar la negociación con las autoridades fiscales.\n\nAmazon establece reservas (\"reserves\") para contingencias fiscales basadas en estimaciones de si, y en qué medida, se deberán impuestos adicionales. Estas reservas se ajustan periódicamente según cambios en hechos y circunstancias, como el resultado de auditorías fiscales. Al 31 de diciembre de 2024, la compañía reportaba pasivos acumulados de $6.5 mil millones por diversas contingencias fiscales.", "respuesta_estructurada": {"respuesta": "Amazon aplica el enfoque de reconocimiento y medición de posiciones fiscales inciertas basado en el estándar ASC 740 (Income Taxes). El proceso consta de dos pasos:\n\n1. **Reconocimiento**: La compañía evalúa si una posición fiscal tiene una probabilidad superior al 50% (\"more likely than not\") de sostenerse técnicamente ante las autoridades fiscales, basándose en interpretaciones de leyes tributarias y resoluciones judiciales.\n\n2. **Medición**: Una vez superado el umbral de reconocimiento, se mide el beneficio fiscal como el mayor monto que tiene más del 50% de probabilidad de realizarse al finalizar la negociación con las autoridades fiscales.\n\nAmazon establece reservas (\"reserves\") para contingencias fiscales basadas en estimaciones de si, y en qué medida, se deberán impuestos adicionales. Estas reservas se ajustan periódicamente según cambios en hechos y circunstancias, como el resultado de auditorías fiscales. Al 31 de diciembre de 2024, la compañía reportaba pasivos acumulados de $6.5 mil millones por diversas contingencias fiscales.", "cifra": null, "unidad": null, "ticker": "AMZN", "ejercicio": null, "fuente": "texto", "cita": "The Company uses significant judgment in (1) determining whether a tax position's technical merits are more likely than not to be sustained and (2) measuring the a <script>
const DATA = JSON.parse(document.getElementById("payload").textContent);
const selected = new Set(DATA.runs.map(r => r.uid));
let activeQid = null;
let metric = "cifra";

function fmtPct(v, n) {
  if (v == null) return "—";
  return v.toFixed(1) + "% (" + n + ")";
}
function fmtNum(v, digits=2) {
  if (v == null || Number.isNaN(v)) return "—";
  return Number(v).toFixed(digits);
}
function fmtCost(v) {
  if (v == null) return "—";
  return "$" + Number(v).toFixed(4);
}
function cellMark(state) {
  if (state === "ok") return "✓";
  if (state === "fail") return "✗";
  return "—";
}
function aciertoPill(v) {
  if (v === true) return '<span class="pill ok">✓</span>';
  if (v === false) return '<span class="pill fail">✗</span>';
  return '<span class="pill na">—</span>';
}

function selectedRuns() {
  return DATA.runs.filter(r => selected.has(r.uid));
}

function renderSidebar() {
  const root = document.getElementById("run-list");
  root.innerHTML = "";
  if (!DATA.runs.length) {
    root.innerHTML = '<div class="empty">No hay *.jsonl en results/</div>';
    return;
  }
  DATA.runs.forEach(run => {
    const div = document.createElement("label");
    div.className = "run-item" + (selected.has(run.uid) ? " selected" : "");
    div.innerHTML =
      '<input type="checkbox" ' + (selected.has(run.uid) ? "checked" : "") + '/>' +
      '<div><strong>' + escapeHtml(run.label) + '</strong>' +
      '<span>' + escapeHtml((run.model_solicitado || "").split(":").pop() || "—") +
      ' · n=' + run.n +
      (run.n_errores ? ' · err=' + run.n_errores : '') +
      '</span></div>';
    const cb = div.querySelector("input");
    cb.addEventListener("change", () => {
      if (cb.checked) selected.add(run.uid); else selected.delete(run.uid);
      renderAll();
    });
    root.appendChild(div);
  });
}

function renderSummary() {
  const runs = selectedRuns();
  const host = document.getElementById("summary-table");
  if (!runs.length) {
    host.innerHTML = '<div class="empty">Selecciona al menos un run.</div>';
    return;
  }
  let html = "<table><thead><tr>" +
    "<th>Run</th><th>n</th><th>cifra</th><th>cita</th><th>trayectoria</th>" +
    "<th>latencia media (s)</th><th>coste total</th><th>coste medio</th>" +
    "<th>LLM total</th><th>LLM medios</th>" +
    "<th>tools total</th><th>tools medios</th><th>errores</th><th>prompt</th><th>commit</th>" +
    "</tr></thead><tbody>";
  runs.forEach(r => {
    html += "<tr>" +
      "<td><strong>" + escapeHtml(r.label) + "</strong><br/><span style='color:var(--muted);font-size:0.75rem'>" +
      escapeHtml(r.timestamp || "") + "</span></td>" +
      "<td class='num'>" + r.n + "</td>" +
      "<td class='num'>" + fmtPct(r.pct_cifra, r.n_cifra) + "</td>" +
      "<td class='num'>" + fmtPct(r.pct_cita, r.n_cita) + "</td>" +
      "<td class='num'>" + fmtPct(r.pct_trayectoria, r.n_trayectoria) + "</td>" +
      "<td class='num'>" + fmtNum(r.latencia_media_s, 2) + "</td>" +
      "<td class='num'>" + fmtCost(r.coste_total) + "</td>" +
      "<td class='num'>" + fmtCost(r.coste_medio) + "</td>" +
      "<td class='num'>" + (r.llm_calls_total ?? 0) + "</td>" +
      "<td class='num'>" + fmtNum(r.llm_calls_medios, 2) + "</td>" +
      "<td class='num'>" + (r.tool_calls_total ?? 0) + "</td>" +
      "<td class='num'>" + fmtNum(r.tool_calls_medios, 2) + "</td>" +
      "<td class='num'>" + r.n_errores + "</td>" +
      "<td>" + escapeHtml(r.prompt_version || "—") + "</td>" +
      "<td><code>" + escapeHtml((r.commit_sha || "—").slice(0, 8)) + "</code></td>" +
      "</tr>";
  });
  html += "</tbody></table>";
  host.innerHTML = html;
}

function renderFamilia() {
  const runs = selectedRuns();
  const host = document.getElementById("familia-table");
  if (!runs.length) {
    host.innerHTML = "";
    return;
  }
  const familias = new Set();
  runs.forEach(r => Object.keys(r.por_familia || {}).forEach(f => familias.add(f)));
  const fams = Array.from(familias).sort();
  let html = "<table><thead><tr><th>Familia</th><th>Run</th><th>n</th>" +
    "<th>cifra</th><th>cita</th><th>trayectoria</th>" +
    "<th>LLM medios</th><th>LLM total</th><th>latencia media (s)</th><th>errores</th>" +
    "</tr></thead><tbody>";
  fams.forEach(fam => {
    runs.forEach(r => {
      const s = (r.por_familia || {})[fam];
      if (!s) return;
      html += "<tr>" +
        "<td>" + escapeHtml(fam) + "</td>" +
        "<td>" + escapeHtml(r.label) + "</td>" +
        "<td class='num'>" + s.n + "</td>" +
        "<td class='num'>" + fmtPct(s.pct_cifra, s.n_cifra) + "</td>" +
        "<td class='num'>" + fmtPct(s.pct_cita, s.n_cita) + "</td>" +
        "<td class='num'>" + fmtPct(s.pct_trayectoria, s.n_trayectoria) + "</td>" +
        "<td class='num'>" + fmtNum(s.llm_calls_medios, 2) + "</td>" +
        "<td class='num'>" + (s.llm_calls_total ?? 0) + "</td>" +
        "<td class='num'>" + fmtNum(s.latencia_media_s, 2) + "</td>" +
        "<td class='num'>" + s.n_errores + "</td>" +
        "</tr>";
    });
  });
  html += "</tbody></table>";
  host.innerHTML = html;
}

function renderHeatmap() {
  const runs = selectedRuns();
  const host = document.getElementById("heatmap");
  if (!runs.length) {
    host.innerHTML = "";
    return;
  }
  const hm = DATA.heatmaps[metric];
  let html = "<table class='heatmap'><thead><tr><th>id</th><th>familia</th>";
  runs.forEach(r => { html += "<th title='" + escapeAttr(r.uid) + "'>" + escapeHtml(r.label) + "</th>"; });
  html += "<th>pregunta</th></tr></thead><tbody>";
  hm.preguntas.forEach(q => {
    const active = activeQid === q.id ? " active" : "";
    html += "<tr class='" + active + "' data-qid='" + escapeAttr(q.id) + "'>" +
      "<td class='qid'>" + escapeHtml(q.id) + "</td>" +
      "<td>" + escapeHtml(q.familia) + "</td>";
    runs.forEach(r => {
      const state = (hm.cells[q.id] || {})[r.uid] || "na";
      html += "<td class='cell " + state + "'>" + cellMark(state) + "</td>";
    });
    html += "<td>" + escapeHtml(q.pregunta) + "</td></tr>";
  });
  html += "</tbody></table>";
  host.innerHTML = html;
  host.querySelectorAll("tr[data-qid]").forEach(tr => {
    tr.addEventListener("click", () => {
      activeQid = tr.getAttribute("data-qid");
      renderHeatmap();
      renderDrill();
    });
  });
}

function renderDrill() {
  const host = document.getElementById("drill");
  if (!activeQid) {
    host.className = "drill";
    host.innerHTML = '<p class="caption">Elige una pregunta en el heatmap.</p>';
    return;
  }
  const byRun = DATA.drilldown[activeQid] || {};
  const runs = selectedRuns().filter(r => byRun[r.uid]);
  const sample = runs.length ? byRun[runs[0].uid] : Object.values(byRun)[0];
  host.className = "drill visible";
  let html = "<h3>" + escapeHtml(activeQid) + " · " + escapeHtml((sample && sample.familia) || "") + "</h3>" +
    "<div class='meta'>" + escapeHtml((sample && sample.pregunta) || "") + "</div>" +
    "<div class='compare-grid'>";
  if (!runs.length) {
    html += '<div class="empty">Esta pregunta no aparece en los runs seleccionados.</div>';
  } else {
    runs.forEach(r => {
      const d = byRun[r.uid];
      html += "<div class='card'><h4>" + escapeHtml(r.label) + "</h4>" +
        "<div class='kv'>" +
        "<dt>cifra</dt><dd>" + aciertoPill(d.acierto_cifra) + " " + escapeHtml(String(d.cifra_agente ?? "—")) +
        " / esp " + escapeHtml(String(d.cifra_esperada ?? "—")) + "</dd>" +
        "<dt>cita</dt><dd>" + aciertoPill(d.acierto_cita) + "</dd>" +
        "<dt>trayectoria</dt><dd>" + aciertoPill(d.acierto_trayectoria) + "</dd>" +
        "<dt>tools</dt><dd>" + escapeHtml(JSON.stringify(d.tool_calls_agente || [])) +
        " (n=" + escapeHtml(String(d.tool_call_count ?? "—")) + ")</dd>" +
        "<dt>LLM calls</dt><dd>" + escapeHtml(String(d.llm_calls ?? "—")) +
        " (OpenRouter / vueltas al modelo)</dd>" +
        "<dt>guardrail retries</dt><dd>" + escapeHtml(String(d.guardrail_retry_count ?? "—")) + "</dd>" +
        "<dt>latencia</dt><dd>" + fmtNum(d.latencia_s, 2) + " s</dd>" +
        "<dt>coste</dt><dd>" + fmtCost(d.coste) + "</dd>" +
        "<dt>error</dt><dd>" + escapeHtml(d.error || "—") + "</dd>" +
        "</div>" +
        "<div style='font-size:0.78rem;color:var(--muted)'>respuesta_estructurada (JSON agente)</div>" +
        "<pre>" + escapeHtml(
          d.respuesta_estructurada
            ? JSON.stringify(d.respuesta_estructurada, null, 2)
            : "—"
        ) + "</pre>" +
        "<div style='font-size:0.78rem;color:var(--muted)'>respuesta_agente (texto)</div>" +
        "<pre>" + escapeHtml(d.respuesta_agente || "—") + "</pre>" +
        "<div style='font-size:0.78rem;color:var(--muted)'>respuesta_esperada</div>" +
        "<pre>" + escapeHtml(d.respuesta_esperada || "—") + "</pre>";
      if (d.tool_calls_detallado && d.tool_calls_detallado.length) {
        html += "<div style='font-size:0.78rem;color:var(--muted)'>tool_calls_detallado</div>" +
          "<pre>" + escapeHtml(JSON.stringify(d.tool_calls_detallado, null, 2)) + "</pre>";
      }
      if (d.errores_metricas && Object.keys(d.errores_metricas).length) {
        html += "<div style='font-size:0.78rem;color:var(--muted)'>errores / detalle métricas</div>" +
          "<pre>" + escapeHtml(JSON.stringify(d.errores_metricas, null, 2)) + "</pre>";
      }
      html += "</div>";
    });
  }
  html += "</div>";
  host.innerHTML = html;
  host.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/'/g, "&#39;");
}

function renderAll() {
  document.getElementById("subtitle").textContent =
    DATA.n_files + " fichero(s) · " + DATA.n_rows + " filas · " +
    DATA.runs.length + " run(s) · " + DATA.results_dir;
  renderSidebar();
  renderSummary();
  renderFamilia();
  renderHeatmap();
  renderDrill();
}

document.getElementById("btn-all").addEventListener("click", () => {
  DATA.runs.forEach(r => selected.add(r.uid));
  renderAll();
});
document.getElementById("btn-none").addEventListener("click", () => {
  selected.clear();
  renderAll();
});
document.getElementById("metric-select").addEventListener("change", (e) => {
  metric = e.target.value;
  renderHeatmap();
});

renderAll();
</script>
</body>
</html>
